<!doctype html>
<html lang="en" data-sq-theme="luca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module demo — Squircle consumer test</title>
    <script type="importmap">
      {
        "imports": {
          "@luca-ecosystem/squircle": "./node_modules/@luca-ecosystem/squircle/dist/squircle-runtime.mjs"
        }
      }
    </script>
    <link rel="stylesheet" href="./node_modules/squircle/dist/squircle.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="sq-skip-link" href="#module-main">Skip to content</a>
    <main id="module-main">
      <section class="sq-section">
        <div class="sq-container sq-stack">
          <p class="sq-small sq-muted">
            Consumer ESM path · bare specifier via import map
          </p>
          <h1>Modules resolve.</h1>
          <p class="sq-lead" id="module-status">Waiting for the module…</p>
          <div class="sq-cluster">
            <a class="sq-button sq-button--secondary" href="index.html"
              >Back to shop</a
            >
            <button
              class="sq-button sq-button--primary"
              type="button"
              id="module-toast"
            >
              Notify from module
            </button>
          </div>
        </div>
      </section>
    </main>
    <script type="module">
      import {
        getTheme,
        setTheme,
        notify,
        init,
      } from "@luca-ecosystem/squircle";
      init();
      document.getElementById("module-status").textContent =
        `Active theme: ${getTheme()}`;
      document.getElementById("module-toast").addEventListener("click", () => {
        setTheme("luca");
        notify("Notified from the ESM import.", { tone: "success" });
      });
    </script>
  </body>
</html>
